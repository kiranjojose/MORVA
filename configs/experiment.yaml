# Experiment configuration. Freeze `split` before any model comparison.

# V2 outputs (tables, figures, runs). V1 results stay in results/ and are not overwritten.
results_dir: results/v2

windows:
  step_s: 60              # resampling step (1 min)
  obs_steps: 20           # history length incl. anchor point (20 min)
  future_steps: 20        # forecast length (20 min)
  horizons_min: [5, 10, 20]
  stride_steps: 5         # spacing between window anchors within a segment
  max_gap_s: 180          # a window is only valid if no original AIS gap inside it exceeds this
  min_mean_sog_kn: 1.0    # exclude moored / drifting windows from the prediction task

split:
  # V2 split, set 2026-10-18 before any V2 data were inspected. Whole-day blocks over DMA files
  # 2026-09-19 .. 2026-10-15 (27 days, UTC):
  #   train 19 Sep (Sat) - 30 Sep (Wed)  12 days, unchanged from V1 so V1 and V2 models stay comparable
  #   val    1 Oct (Thu) -  6 Oct (Tue)   6 days = V1 val + the spent V1 test (both already seen; development only)
  #   test   7 Oct (Wed) - 15 Oct (Thu)   9 days, never ingested before this split was set (LOCKED)
  # Windows ending after test_end are excluded, so later downloads cannot silently enter the test block.
  # Windows in the transfer_aois get transfer_context / transfer_val / transfer_test labels and are never trained on.
  # V1 (frozen 2026-10-09, test spent): train_end 2026-10-01, val_end 2026-10-04, data through 2026-10-06.
  train_end: "2026-10-01T00:00:00"
  val_end: "2026-10-07T00:00:00"
  test_end: "2026-10-16T00:00:00"
  auto_fractions: [0.7, 0.15]   # only used if the explicit boundaries above are null

baselines:
  ctrv_turn_window_steps: 5      # steps of history used to estimate turn rate
  ctrv_max_turn_rate_deg_s: 3.0
  ctrv_min_sog_kn: 1.0           # below this, turn rate is treated as 0
  ctrv_damped_tau_grid_s: [30, 60, 120, 180, 300, 600]   # turn-decay time constant, tuned on TRAIN only
  kalman_q_grid: [1.0e-4, 1.0e-3, 1.0e-2, 3.0e-2, 0.1, 0.3, 1.0]   # CV-Kalman process noise (m^2/s^3), tuned on TRAIN only
  tuning_max_windows: 60000      # random train subsample used for tuning

evaluation:
  n_bootstrap: 1000
  seed: 42

gbm:
  # Residual gradient boosting: CV forecast + learned body-frame correction at knot horizons.
  knots_min: [5, 10, 15, 20]
  seed: 0
  feature_sets:                  # context ablation (E3/E4); every model is trained on TRAIN only
    A_motion: [motion]
    B_vessel: [motion, vessel]
    C_location: [motion, location]
    D_all: [motion, vessel, location]
  spatial:
    # Spatially held-out evaluation (H4): hold out one longitude band at a time. Training excludes every window
    # whose history or future comes within `buffer_deg` of the held-out band, so no route crosses the boundary.
    lon_edges: [10.4, 11.05, 11.7, 12.35, 13.0]
    buffer_deg: 0.05             # ~3 km at 55.5 N
