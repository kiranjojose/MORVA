# Experiment configuration. Freeze `split` before any model comparison.

windows:
  step_s: 60              # resampling step (1 min)
  obs_steps: 20           # history length incl. anchor point (20 min)
  future_steps: 20        # forecast length (20 min)
  horizons_min: [5, 10, 20]
  stride_steps: 5         # spacing between window anchors within a segment
  max_gap_s: 180          # a window is only valid if no original AIS gap inside it exceeds this
  min_mean_sog_kn: 1.0    # exclude moored / drifting windows from the prediction task

split:
  # Whole-day time blocks over DMA files 2026-09-19 .. 2026-10-06 (18 days, UTC):
  #   train 19 Sep (Sat) - 30 Sep (Wed)  12 days, two weekends
  #   val    1 Oct (Thu) -  3 Oct (Sat)   3 days, incl. a weekend day
  #   test   4 Oct (Sun) -  6 Oct (Tue)   3 days, incl. a weekend day  (LOCKED)
  # Set 2026-10-09. Do not change after the first model comparison.
  train_end: "2026-10-01T00:00:00"
  val_end: "2026-10-04T00:00:00"
  auto_fractions: [0.7, 0.15]   # only used if the explicit boundaries above are null

baselines:
  ctrv_turn_window_steps: 5      # steps of history used to estimate turn rate
  ctrv_max_turn_rate_deg_s: 3.0
  ctrv_min_sog_kn: 1.0           # below this, turn rate is treated as 0
  ctrv_damped_tau_grid_s: [30, 60, 120, 180, 300, 600]   # turn-decay time constant, tuned on TRAIN only
  tuning_max_windows: 60000      # random train subsample used for tuning

evaluation:
  n_bootstrap: 1000
  seed: 42
