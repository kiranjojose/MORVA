[project]
name = "vesselmind"
version = "0.1.0"
description = "Context-aware vessel behaviour modelling from historical AIS: reproducible baselines, prediction and anomaly analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.10",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
ml = ["torch>=2.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ipykernel>=6"]

[project.scripts]
vesselmind = "vesselmind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vesselmind"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
